; ============================================================================
;  Mac Panel - Pantalla d'estat del Mac + shortcuts (ESP32)
;  Plataforma: ESP32-WROOM-32E (LCDWiki E32R40T / ESP32-32E) + ST7796S 320x480
;  Compilar i pujar:  pio run -t upload      Monitor:  pio device monitor
;
;  La configuracio de maquinari (pins i TFT_eSPI) es la mateixa que la
;  validada al projecte Tamagoxi, aixi que funciona a la placa sense ajustos.
; ============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Aquesta placa va pel xip USB-serie CH340.
; (El nom del dispositiu pot canviar entre connexions: comprova'l amb
;  'pio device list' i ajusta'l aqui si cal.)
upload_port = /dev/cu.usbserial-1420
monitor_port = /dev/cu.usbserial-1420

; 4 MB de flash, particio d'aplicacio gran i sense OTA (taula estandard).
; La configuracio de la pantalla es desa a SPIFFS (particio de 960 KB inclosa
; en aquesta taula), no a la NVS: la NVS es petita i WiFi/Bluetooth ja la fan
; servir. Aixi l'aplicacio queda a 0x10000 i no cal tocar cap offset.
board_build.partitions = huge_app.csv

upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    ; Imprescindible: TFT_eSPI ha de trobar include/tft_setup.h
    ; (el carrega ell sol via __has_include(<tft_setup.h>)).
    -I include

lib_deps =
    ; Mateixa versio validada al projecte Tamagoxi.
    TFT_eSPI@2.5.43
    ; Teclat Bluetooth (BLE HID): els botons envien tecles de debor al Mac
    ; (volum, mitjans, copiar/enganxar...). L'ESP32 classic no te USB natiu,
    ; aixi que l'HID va per Bluetooth.
    https://github.com/T-vK/ESP32-BLE-Keyboard.git
